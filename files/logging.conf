log_format audit escape=json
    '$time_iso8601\t'
    '$remote_addr\t'
    '$realip_remote_addr\t'
    '$request_method\t'
    '$scheme\t'
    '$http_host\t'
    '$request_uri\t'
    '$server_protocol\t'
    '$status\t'
    '$bytes_sent\t'
    '$upstream_response_time\t'
    '$request_time\t'
    '$request_length\t'
    '$http_user_agent';
