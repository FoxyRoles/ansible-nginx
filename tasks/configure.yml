---

- name: Ensure nginx configuration and web directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/sites.d
    - /etc/nginx/snippets
    - /var/www/html

- name: Configure the local default virtual host
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ nginx_local_vhost_config }}"
    mode: '0644'
    backup: true
  notify:
    - restart nginx

- name: Remove the former disabled default virtual host
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf.disabled
    state: absent

- name: Ensure SSL directory for certs present
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    mode: 0700

- name: Ensure configs are present
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/nginx/conf.d/{{ item }}"
  loop:
    - cloudflare.conf
    - gzip.conf
    - logging.conf
    - ssl.conf
  notify:
    - restart nginx

- name: Ensure snippets are present
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/nginx/snippets/{{ item }}"
  loop:
    - secure_files
  notify:
    - restart nginx

- name: Ensure php.conf is present
  ansible.builtin.template:
    src: php.conf.j2
    dest: /etc/nginx/conf.d/php.conf
  notify:
   - restart nginx

- name: Ensure nginx.conf is actual
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify:
   - restart nginx

- name: Ensure FastCGI parameters are configured
  ansible.builtin.copy:
    src: fastcgi_params
    dest: /etc/nginx/fastcgi_params
  notify:
   - restart nginx

- name: Ensure FastCGI limits are configured
  ansible.builtin.copy:
    src: fastcgi_limits
    dest: /etc/nginx/fastcgi_limits
  notify:
   - restart nginx
