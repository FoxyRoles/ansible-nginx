---

- name: Ensure nginx configuration and web directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/sites.d
    - /etc/nginx/snippets
    - /var/www/html

- name: Disable the packaged default virtual host
  ansible.builtin.command: >-
    mv --backup=numbered /etc/nginx/conf.d/default.conf
    /etc/nginx/conf.d/default.conf.disabled
  args:
    removes: /etc/nginx/conf.d/default.conf
  notify:
    - restart nginx

- name: Ensure SSL directory for certs present
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: 0700

- name: Ensure configs are present
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/nginx/conf.d/{{ item }}"
  loop:
    - cloudflare.conf
    - gzip.conf
    - logging.conf
    - ssl.conf
  notify:
    - restart nginx

- name: Ensure snippets are present
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/nginx/snippets/{{ item }}"
  loop:
    - secure_files
  notify:
    - restart nginx

- name: Ensure php.conf is present
  template:
    src: php.conf.j2
    dest: /etc/nginx/conf.d/php.conf
  notify:
   - restart nginx

- name: Ensure nginx.conf is actual
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify:
   - restart nginx

- name: Ensure FastCGI parameters are configured
  copy:
    src: fastcgi_params
    dest: /etc/nginx/fastcgi_params
  notify:
   - restart nginx

- name: Ensure FastCGI limits are configured
  copy:
    src: fastcgi_limits
    dest: /etc/nginx/fastcgi_limits
  notify:
   - restart nginx
