---

- name: Default zone present
  ansible.builtin.template:
    src: default_zone.j2
    dest: /etc/nginx/sites.d/000-default.conf
  notify:
   - restart nginx

- name: Empty default index present
  ansible.builtin.copy:
    src: index.html
    dest: /var/www/html/index.html

- name: Create zones
  ansible.builtin.template:
    src: zone.conf.j2
    dest: "/etc/nginx/sites.d/{{ item }}.conf"
  loop: "{{ nginx_zones | default([]) | flatten(1, skip_nulls=false) }}"
  notify:
   - restart nginx

- name: Create home directory for zone
  ansible.builtin.file:
    path: "/home/{{ nginx_user }}/{{ item }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
  loop: "{{ nginx_zones | default([]) | flatten(1, skip_nulls=false) }}"

- name: Create www directory for zone
  ansible.builtin.file:
    path: "/home/{{ nginx_user }}/{{ item }}/www"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
  loop: "{{ nginx_zones | default([]) | flatten(1, skip_nulls=false) }}"
