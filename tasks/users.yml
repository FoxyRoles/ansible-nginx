---

- name: nginx group present
  ansible.builtin.group:
    gid: "{{ nginx_gid }}"
    name: "{{ nginx_group }}"
    state: present

- name: nginx user present
  ansible.builtin.user:
    uid: "{{ nginx_uid }}"
    name: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    shell: "{{ nginx_user_shell }}"
    state: present

- name: Ensure user home directory present
  ansible.builtin.file:
    path: "/home/{{ nginx_user }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
