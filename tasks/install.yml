---

- name: Remove the legacy nginx APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nginx.list
    state: absent

- name: Install nginx repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the official stable nginx APT repository
  ansible.builtin.deb822_repository:
    name: nginx
    uris: "https://nginx.org/packages/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: nginx
    signed_by: https://nginx.org/keys/nginx_signing.key

- name: nginx is installed
  ansible.builtin.apt:
    pkg: nginx
    state: present
    update_cache: true

- name: nginx is running
  service:
    name: nginx
    state: started
    enabled: yes
