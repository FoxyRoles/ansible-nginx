---

- name: "Logrotate have proper log permissions set"
  lineinfile:
    path: /etc/logrotate.d/nginx
    regexp: '^\s*create'
    line: "\tcreate 0640 {{ nginx_user }} adm"

- name: Logs have proper owner
  command: >-
    find /var/log/nginx -type f -exec chown {{ nginx_user }}:adm {} \;

- name: Logs have proper permissions
  command: >-
    find /var/log/nginx -type f -exec chmod 0640 {} \;
