---

- name: "Logrotate have proper log permissions set"
  lineinfile:
    path: /etc/logrotate.d/nginx
    regexp: '^\s*create'
    line: "\tcreate 0640 {{ nginx_user }} adm"

- name: Find Nginx log files
  ansible.builtin.find:
    paths: /var/log/nginx
    file_type: file
    recurse: true
    hidden: true
  register: nginx_log_files

- name: Set Nginx log ownership and permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    follow: false
    owner: "{{ nginx_user }}"
    group: adm
    mode: '0640'
  loop: "{{ nginx_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
